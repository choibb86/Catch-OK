<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>옥을 잡아라! Catch the OK (Pro)</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(circle at top, #142c20, #050a08 70%);
      color: white;
      overflow: hidden;
    }

    #game {
      position: relative;
      width: min(100vw, 480px);
      height: 100vh;
      max-height: 860px;
      overflow: hidden;
      background:
        linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.5)),
        radial-gradient(circle at 50% 30%, #1f5036, #07100b 80%);
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      border-radius: 12px;
    }

    #feverGlow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 4px solid transparent;
      z-index: 12;
      transition: border-color .3s;
    }

    .fever-active #feverGlow {
      border-color: #ffd84c;
      animation: pulseGlow .6s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: inset 0 0 15px #ffb300; }
      to { box-shadow: inset 0 0 35px #ff4500; }
    }

    #topBar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      font-weight: 800;
      font-size: 15px;
    }

    .pill {
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #feverBarContainer {
      position: absolute;
      top: 60px;
      left: 16px;
      right: 16px;
      height: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      overflow: hidden;
      z-index: 20;
    }

    #feverBar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #43d46e, #ffe65a, #ff4500);
      transition: width 0.1s linear;
    }

    #title {
      position: absolute;
      top: 80px;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #title h1 {
      margin: 0;
      font-size: 30px;
      color: #8cff9e;
      text-shadow: 0 0 10px rgba(112,255,140,.5), 0 3px 0 #123d20;
    }

    #combo {
      position: absolute;
      top: 122px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: #fff86b;
      z-index: 15;
      opacity: 0;
      transform: scale(.7);
      transition: .12s;
      text-shadow: 0 2px 6px black;
      pointer-events: none;
    }

    #combo.show {
      opacity: 1;
      transform: scale(1);
    }

    .target {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      cursor: pointer;
      animation: pop .18s ease-out;
      box-shadow: 0 6px 18px rgba(0,0,0,.45);
      z-index: 8;
    }

    .jade {
      background: radial-gradient(circle at 35% 25%, #d8ffe1, #43d46e 35%, #0c7438 72%);
      border: 4px solid rgba(255,255,255,.9);
      color: white;
      font-size: 30px;
      text-shadow: 0 2px 4px #06441e;
    }

    .gold {
      background: radial-gradient(circle at 35% 25%, #fffbc7, #ffd84c 35%, #e08b00 75%);
      border: 4px solid #fff3a0;
      color: #5a3700;
      font-size: 26px;
    }

    .ok {
      background: #f5ff50;
      border: 4px solid white;
      color: #0d491d;
      font-size: 22px;
      transform: rotate(-8deg);
    }

    .bad {
      background: radial-gradient(circle at 35% 25%, #ff7b7b, #e92626 50%, #6e0000);
      border: 4px solid #fff;
      color: #fff;
      font-size: 16px;
      text-align: center;
      line-height: 1.1;
      transform: rotate(7deg);
    }

    .bomb {
      background: radial-gradient(circle at 35% 25%, #666, #222 50%, #000);
      border: 4px solid #ff4444;
      font-size: 28px;
    }

    @keyframes pop {
      from { transform: scale(.2); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .floatText {
      position: absolute;
      z-index: 30;
      font-weight: 900;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp .7s ease-out forwards;
      text-shadow: 0 2px 4px black;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(.7); opacity: 0; }
      20% { opacity: 1; transform: translateY(-10px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-65px) scale(1); }
    }

    #startScreen, #endScreen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 24px;
      text-align: center;
      background: rgba(4, 12, 7, .92);
      backdrop-filter: blur(8px);
    }

    #endScreen { display: none; }

    .bigEmoji { font-size: 68px; margin-bottom: 8px; }
    .screenTitle { font-size: 34px; font-weight: 900; margin-bottom: 8px; }
    .screenText { font-size: 15px; line-height: 1.6; opacity: .9; margin-bottom: 20px; }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      background: #72f28b;
      color: #0b3717;
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
      transition: transform .1s;
    }
    button:active { transform: scale(0.96); }

    .confetti {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: fall 1.8s linear forwards;
    }

    @keyframes fall {
      from { transform: translateY(-40px) rotate(0deg); }
      to { transform: translateY(105vh) rotate(720deg); }
    }
  </style>
</head>

<body>

<div id="game">
  <div id="feverGlow"></div>

  <div id="topBar">
    <div class="pill">💎 <span id="score">0</span></div>
    <div class="pill">🔥 Lv.<span id="level">1</span></div>
    <div class="pill">⏱ <span id="time">30</span>s</div>
  </div>

  <div id="feverBarContainer">
    <div id="feverBar"></div>
  </div>

  <div id="title">
    <h1>옥을 잡아라!</h1>
  </div>

  <div id="combo"></div>

  <div id="startScreen">
    <div class="bigEmoji">💎</div>
    <div class="screenTitle">옥을 잡아라!</div>
    <div class="screenText">
      옥(玉) = +10점 💎 | 황금옥 = +30점 ✨<br>
      OK! = +20점 👌 | 안옼케이 = -20점 ❌<br>
      💣 폭탄 = -50점 및 피버 초기화<br><br>
      연속으로 맞히면 <b>FEVER 타임 (점수 2배)</b> 발동!
    </div>
    <button onclick="startGame()">도전 시작 👌</button>
  </div>

  <div id="endScreen">
    <div class="bigEmoji" id="resultEmoji">💎</div>
    <div class="screenTitle" id="resultTitle">게임 종료!</div>
    <div class="screenText">
      최종 점수<br>
      <b style="font-size:40px;color:#8cff9e;" id="finalScore">0</b> 점
      <div id="resultComment" style="margin-top:14px;"></div>
    </div>
    <button onclick="startGame()">다시 잡기</button>
  </div>
</div>

<script>
  const game = document.getElementById("game");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const levelEl = document.getElementById("level");
  const comboEl = document.getElementById("combo");
  const feverBar = document.getElementById("feverBar");

  let score = 0;
  let timeLeft = 30;
  let timer = null;
  let spawnTimer = null;
  let combo = 0;
  let feverGauge = 0;
  let isFever = false;
  let feverTimer = null;
  let playing = false;
  let audioCtx = null;

  // Web Audio 효과음 (외부 리소스 없이 작동)
  function playSound(type) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === "jade") {
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.08); // G5
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === "gold") {
      osc.frequency.setValueAtTime(659.25, now); // E5
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now);
      osc.stop(now + 0.18);
    } else if (type === "bad") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.linearRampToValueAtTime(90, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === "bomb") {
      osc.type = "square";
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.linearRampToValueAtTime(40, now + 0.25);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === "fever") {
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  }

  function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("endScreen").style.display = "none";
    document.querySelectorAll(".target").forEach(el => el.remove());

    score = 0;
    timeLeft = 30;
    combo = 0;
    feverGauge = 0;
    isFever = false;
    playing = true;

    game.classList.remove("fever-active");
    scoreEl.innerText = score;
    timeEl.innerText = timeLeft;
    levelEl.innerText = "1";
    updateFeverUI();

    clearInterval(timer);
    clearInterval(spawnTimer);
    clearTimeout(feverTimer);

    timer = setInterval(() => {
      timeLeft--;
      timeEl.innerText = timeLeft;

      // 난이도 상승 (시간에 따른 스폰 속도 조절)
      const currentLevel = Math.min(4, Math.floor((30 - timeLeft) / 8) + 1);
      levelEl.innerText = currentLevel;

      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);

    runSpawner();
  }

  function getSpawnInterval() {
    const elapsed = 30 - timeLeft;
    return Math.max(260, 520 - (elapsed * 9));
  }

  function runSpawner() {
    if (!playing) return;
    spawnTarget();
    spawnTimer = setTimeout(runSpawner, getSpawnInterval());
  }

  function spawnTarget() {
    if (!playing) return;

    const target = document.createElement("div");
    target.classList.add("target");

    const r = Math.random();
    let type = "jade";
    let points = 10;
    let text = "玉";

    if (r < 0.12) {
      type = "gold";
      points = 30;
      text = "玉✨";
    } else if (r < 0.26) {
      type = "ok";
      points = 20;
      text = "OK!";
    } else if (r < 0.38) {
      type = "bad";
      points = -20;
      text = "안옼\n케이";
    } else if (r < 0.44 && (30 - timeLeft) > 6) {
      type = "bomb";
      points = -50;
      text = "💣";
    }

    target.classList.add(type);
    target.innerText = text;

    const size = 76;
    const maxX = game.clientWidth - size - 16;
    const minY = 160;
    const maxY = game.clientHeight - size - 40;

    target.style.left = Math.floor(Math.random() * Math.max(1, maxX - 16)) + 16 + "px";
    target.style.top = Math.floor(Math.random() * Math.max(1, maxY - minY)) + minY + "px";

    game.appendChild(target);

    const life = type === "gold" ? 750 : (type === "bomb" ? 1200 : 950);

    const removeTimer = setTimeout(() => {
      if (target.parentElement) {
        target.remove();
        if (type !== "bad" && type !== "bomb") {
          combo = 0;
          updateCombo();
        }
      }
    }, life);

    const handleHit = (e) => {
      e.stopPropagation();
      e.preventDefault();
      clearTimeout(removeTimer);
      const rect = target.getBoundingClientRect();
      const gameRect = game.getBoundingClientRect();
      hitTarget(type, points, rect.left - gameRect.left + 20, rect.top - gameRect.top);
      target.remove();
    };

    target.addEventListener("pointerdown", handleHit);
  }

  function hitTarget(type, basePoints, x, y) {
    let finalPoints = basePoints;

    if (type === "bad" || type === "bomb") {
      combo = 0;
      feverGauge = 0;
      updateFeverUI();
      playSound(type);

      if (type === "bomb") {
        showFloatingText("폭탄! -50 💥", x, y, "#ff3333");
        vibrate([100, 50, 100]);
      } else {
        showFloatingText("안옼케이! -20 😭", x, y, "#ff6b6b");
        vibrate([60, 40, 60]);
      }
    } else {
      combo++;
      playSound(type);

      if (isFever) {
        finalPoints *= 2;
      } else {
        feverGauge = Math.min(100, feverGauge + 15);
        updateFeverUI();
        if (feverGauge >= 100) triggerFever();
      }

      if (type === "gold") {
        showFloatingText(`황금옥! +${finalPoints} ✨`, x, y, "#ffe65a");
      } else if (type === "ok") {
        showFloatingText(`OK! +${finalPoints} 👌`, x, y, "#dcff48");
      } else {
        showFloatingText(`옥! +${finalPoints} 💎`, x, y, "#80ff9a");
      }

      vibrate(25);
    }

    score = Math.max(0, score + finalPoints);
    scoreEl.innerText = score;
    updateCombo();
  }

  function updateFeverUI() {
    feverBar.style.width = feverGauge + "%";
  }

  function triggerFever() {
    isFever = true;
    game.classList.add("fever-active");
    playSound("fever");
    showFloatingText("🔥 FEVER MODE 2X! 🔥", game.clientWidth / 2 - 90, 200, "#ffd84c");

    let remain = 5000;
    const interval = 100;
    feverTimer = setInterval(() => {
      remain -= interval;
      feverGauge = (remain / 5000) * 100;
      updateFeverUI();

      if (remain <= 0) {
        clearInterval(feverTimer);
        isFever = false;
        feverGauge = 0;
        updateFeverUI();
        game.classList.remove("fever-active");
      }
    }, interval);
  }

  function updateCombo() {
    if (combo >= 3) {
      comboEl.innerText = `${combo} COMBO! 🔥`;
      comboEl.classList.add("show");
    } else {
      comboEl.classList.remove("show");
    }
  }

  function showFloatingText(text, x, y, color) {
    const floatText = document.createElement("div");
    floatText.className = "floatText";
    floatText.innerText = text;
    floatText.style.left = Math.max(10, Math.min(game.clientWidth - 140, x)) + "px";
    floatText.style.top = y + "px";
    floatText.style.color = color;
    game.appendChild(floatText);
    setTimeout(() => floatText.remove(), 700);
  }

  function endGame() {
    playing = false;
    clearInterval(timer);
    clearTimeout(spawnTimer);
    clearInterval(feverTimer);

    document.querySelectorAll(".target").forEach(el => el.remove());
    document.getElementById("finalScore").innerText = score;

    let title = "슬슬 옥케이";
    let comment = "옥 맛을 조금 아시는군요! 👌";
    let emoji = "👌";

    if (score < 150) {
      title = "안옼케이...";
      comment = "옥이 손가락 사이로 빠져나갔습니다 😭";
      emoji = "🥲";
    } else if (score >= 450) {
      title = "완전 옥케이 황제!";
      comment = "초고수의 피버 컨트롤! 마카오 진출 완료 🎰";
      emoji = "👑";
      triggerConfetti();
    } else if (score >= 280) {
      title = "옥부자 탄생";
      comment = "손이 보이지 않는 순발력! 💎";
      emoji = "💎";
    }

    document.getElementById("resultTitle").innerText = title;
    document.getElementById("resultComment").innerText = comment;
    document.getElementById("resultEmoji").innerText = emoji;
    document.getElementById("endScreen").style.display = "flex";
  }

  function triggerConfetti() {
    const items = ["💎", "✨", "🪙", "🎰", "👌", "💚"];
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const c = document.createElement("div");
        c.className = "confetti";
        c.innerText = items[Math.floor(Math.random() * items.length)];
        c.style.left = Math.random() * 90 + "%";
        c.style.top = "-20px";
        game.appendChild(c);
        setTimeout(() => c.remove(), 1800);
      }, i * 40);
    }
  }

  function vibrate(p) {
    if (navigator.vibrate) navigator.vibrate(p);
  }
</script>
</body>
</html>
