<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>옥 게임 월드! 3 in 1</title>
  <meta property="og:title" content="옥 게임 월드! 3종 미니게임 대격돌 💎" />
  <meta property="og:description" content="옥 잡기, 피하기, 플래피 버드까지! 지금 도전하세요 👌" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
    body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: radial-gradient(circle at top, #142c20, #050a08 70%); color: #ffffff; overflow: hidden; }
    #app { position: relative; width: min(100vw, 480px); height: 100vh; max-height: 860px; overflow: hidden; background: linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.5)), radial-gradient(circle at 50% 30%, #1f5036, #07100b 80%); box-shadow: 0 0 40px rgba(0,0,0,0.8); border-radius: 12px; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; background: rgba(4, 12, 7, 0.96); backdrop-filter: blur(8px); z-index: 100; color: #ffffff; }
    .hidden { display: none !important; }
    .bigEmoji { font-size: 56px; margin-bottom: 8px; }
    .screenTitle { font-size: 28px; font-weight: 900; margin-bottom: 8px; color: #8cff9e; }
    .screenText { font-size: 15px; line-height: 1.5; opacity: 0.9; margin-bottom: 20px; color: #ffffff; }
    .menu-btn { width: 100%; max-width: 300px; margin-bottom: 12px; border: none; border-radius: 999px; padding: 15px 18px; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.35); transition: transform 0.1s; }
    .menu-btn:active { transform: scale(0.96); }
    .btn-green { background: #72f28b; color: #0b3717; }
    .btn-blue { background: #4dabf7; color: #0b1f37; }
    .btn-yellow { background: #ffd84c; color: #3d2800; }
    .btn-back { background: rgba(255,255,255,0.2); color: white; margin-top: 8px; }
    .pill { background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 14px; color: white; }
    #catchGameArea { position: absolute; inset: 0; }
    #feverGlow { position: absolute; inset: 0; pointer-events: none; border: 4px solid transparent; z-index: 12; transition: border-color .3s; }
    .fever-active #feverGlow { border-color: #ffd84c; animation: pulseGlow .6s infinite alternate; }
    @keyframes pulseGlow { from { box-shadow: inset 0 0 15px #ffb300; } to { box-shadow: inset 0 0 35px #ff4500; } }
    #topBar1, #topBar2, #topBar3 { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; z-index: 20; font-weight: 800; font-size: 15px; pointer-events: none; }
    #feverBarContainer { position: absolute; top: 60px; left: 16px; right: 16px; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; z-index: 20; pointer-events: none; }
    #feverBar { width: 0%; height: 100%; background: linear-gradient(90deg, #43d46e, #ffe65a, #ff4500); transition: width 0.1s linear; }
    #combo { position: absolute; top: 122px; width: 100%; text-align: center; font-size: 22px; font-weight: 900; color: #fff86b; z-index: 15; opacity: 0; transform: scale(.7); transition: .12s; text-shadow: 0 2px 6px black; pointer-events: none; }
    #combo.show { opacity: 1; transform: scale(1); }
    .target { position: absolute; width: 84px; height: 84px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; cursor: pointer; animation: pop .18s ease-out; box-shadow: 0 6px 18px rgba(0,0,0,.45); z-index: 8; background-size: cover; background-position: center; }
    .jade { background-color: #0c7438; background-image: radial-gradient(circle at 35% 25%, #d8ffe1, #43d46e 35%, #0c7438 72%); border: 4px solid rgba(255,255,255,.9); color: white; font-size: 30px; text-shadow: 0 2px 4px #06441e; }
    .gold { background-color: #e08b00; background-image: radial-gradient(circle at 35% 25%, #fffbc7, #ffd84c 35%, #e08b00 75%); border: 4px solid #fff3a0; color: #5a3700; font-size: 26px; }
    .target-ok-photo { background-color: #ffd84c; background-image: url('./ok_photo.png.jpg'); border: 4px solid #fff86b; box-shadow: 0 0 16px rgba(255, 230, 90, 0.8); }
    .target-bad-photo { background-color: #333; background-image: url('./bad_photo.png.jpg'); border: 4px solid #ff2222; box-shadow: 0 0 16px rgba(255, 34, 34, 0.8); }
    @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floatText { position: absolute; z-index: 30; font-weight: 900; font-size: 22px; pointer-events: none; animation: floatUp .7s ease-out forwards; text-shadow: 0 2px 4px black; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(.7); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.15); } 100% { opacity: 0; transform: translateY(-65px) scale(1); } }
    #dodgeGameArea, #flappyGameArea { position: absolute; inset: 0; }
    #dodgeGameArea { touch-action: none; }
    #dodgeCanvas, #flappyCanvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
<div id="app">
  <div id="menuScreen" class="screen">
    <div class="bigEmoji">🎮</div>
    <div class="screenTitle">옥 게임 월드</div>
    <div class="screenText">플레이할 게임을 선택하세요!</div>
    <button class="menu-btn btn-green" onclick="startCatchGame()">💎 옥을 잡아라 (터치 순발력)</button>
    <button class="menu-btn btn-blue" onclick="startDodgeGame()">🏃 안옼케이를 피해라 (무빙 회피)</button>
    <button class="menu-btn btn-yellow" onclick="startFlappyGame()">🐤 날아라 오케이 (탭 점프)</button>
  </div>

  <div id="catchGameArea" class="hidden">
    <div id="feverGlow"></div>
    <div id="topBar1">
      <div class="pill">💎 <span id="score1">0</span></div>
      <div class="pill">⏱ <span id="time1">30</span>s</div>
    </div>
    <div id="feverBarContainer"><div id="feverBar"></div></div>
    <div id="combo"></div>
    <div id="catchEndScreen" class="screen hidden">
      <div class="bigEmoji">💎</div>
      <div class="screenTitle">게임 종료!</div>
      <div class="screenText">최종 점수<br><b style="font-size:40px;color:#8cff9e;" id="finalScore1">0</b> 점</div>
      <button class="menu-btn btn-green" onclick="startCatchGame()">다시 하기</button>
      <button class="menu-btn btn-back" onclick="goToMenu()">메뉴로 가기</button>
    </div>
  </div>

  <div id="dodgeGameArea" class="hidden">
    <div id="topBar2">
      <div class="pill">💎 <span id="score2">0</span>점</div>
      <div class="pill">❤️ <span id="lives2">❤️❤️❤️</span></div>
      <div class="pill">⏱ <span id="time2">0</span>초</div>
    </div>
    <canvas id="dodgeCanvas"></canvas>
    <div id="dodgeEndScreen" class="screen hidden">
      <div class="bigEmoji">💥</div>
      <div class="screenTitle" style="color:#ff6b6b;">게임 오버!</div>
      <div class="screenText">생존 시간: <b id="finalTime2" style="color:#ffe65a;">0</b>초<br>최종 점수: <b id="finalScore2" style="font-size:36px;color:#72f28b;">0</b> 점</div>
      <button class="menu-btn btn-blue" onclick="startDodgeGame()">다시 달리기</button>
      <button class="menu-btn btn-back" onclick="goToMenu()">메뉴로 가기</button>
    </div>
  </div>

  <div id="flappyGameArea" class="hidden">
    <div id="topBar3">
      <div class="pill">🚩 통과: <span id="score3">0</span></div>
      <div class="pill">👑 최고: <span id="best3">0</span></div>
    </div>
    <canvas id="flappyCanvas"></canvas>
    <div id="flappyEndScreen" class="screen hidden">
      <div class="bigEmoji">💀</div>
      <div class="screenTitle" style="color:#ff6b6b;">추락했습니다!</div>
      <div class="screenText">통과한 기둥 수<br><b style="font-size:42px;color:#ffd84c;" id="finalScore3">0</b> 개</div>
      <button class="menu-btn btn-yellow" onclick="startFlappyGame()">다시 날기</button>
      <button class="menu-btn btn-back" onclick="goToMenu()">메뉴로 가기</button>
    </div>
  </div>
</div>

<script>
  const menuScreen = document.getElementById("menuScreen");
  const catchGameArea = document.getElementById("catchGameArea");
  const dodgeGameArea = document.getElementById("dodgeGameArea");
  const flappyGameArea = document.getElementById("flappyGameArea");
  const okImg = new Image(); okImg.src = './ok_photo.png.jpg';
  const badImg = new Image(); badImg.src = './bad_photo.png.jpg';

  let audioCtx = null;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (type === 'jump') {
        osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'pass') {
        osc.frequency.setValueAtTime(523, now); osc.frequency.exponentialRampToValueAtTime(1046, now + 0.12);
        gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'hit' || type === 'bad') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(60, now + 0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'item' || type === 'ok') {
        osc.frequency.setValueAtTime(659, now); osc.frequency.exponentialRampToValueAtTime(1318, now + 0.15);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);
      }
    } catch(e) {}
  }

  function goToMenu() {
    stopCatchGame(); stopDodgeGame(); stopFlappyGame();
    catchGameArea.classList.add("hidden"); dodgeGameArea.classList.add("hidden"); flappyGameArea.classList.add("hidden");
    menuScreen.classList.remove("hidden");
  }

  /* 1. Catch */
  let catchTimer = null, catchSpawnTimer = null, feverTimer = null;
  let score1 = 0, timeLeft1 = 30, combo1 = 0, feverGauge1 = 0, isFever1 = false, catchPlaying = false;

  function startCatchGame() {
    menuScreen.classList.add("hidden"); dodgeGameArea.classList.add("hidden"); flappyGameArea.classList.add("hidden");
    catchGameArea.classList.remove("hidden"); document.getElementById("catchEndScreen").classList.add("hidden");
    document.querySelectorAll(".catch-target").forEach(el => el.remove());
    score1 = 0; timeLeft1 = 30; combo1 = 0; feverGauge1 = 0; isFever1 = false; catchPlaying = true;
    document.getElementById("score1").innerText = score1; document.getElementById("time1").innerText = timeLeft1;
    document.getElementById("feverBar").style.width = "0%"; catchGameArea.classList.remove("fever-active");
    clearInterval(catchTimer); clearTimeout(catchSpawnTimer); clearInterval(feverTimer);
    catchTimer = setInterval(() => {
      timeLeft1--; document.getElementById("time1").innerText = timeLeft1;
      if (timeLeft1 <= 0) endCatchGame();
    }, 1000);
    runCatchSpawner();
  }

  function runCatchSpawner() {
    if (!catchPlaying) return;
    spawnCatchTarget();
    const interval = Math.max(260, 520 - ((30 - timeLeft1) * 8));
    catchSpawnTimer = setTimeout(runCatchSpawner, interval);
  }

  function spawnCatchTarget() {
    if (!catchPlaying) return;
    const target = document.createElement("div");
    target.classList.add("target", "catch-target");
    const r = Math.random();
    let type = "jade", points = 10, text = "玉";
    if (r < 0.20) { type = "target-ok-photo"; points = 50; text = ""; }
    else if (r < 0.35) { type = "target-bad-photo"; points = -100; text = ""; }
    else if (r < 0.50) { type = "gold"; points = 30; text = "玉✨"; }
    target.classList.add(type); target.innerText = text;
    const size = 84;
    const maxX = catchGameArea.clientWidth - size - 16;
    const minY = 90;
    const maxY = catchGameArea.clientHeight - size - 40;
    target.style.left = Math.floor(Math.random() * Math.max(1, maxX - 16)) + 16 + "px";
    target.style.top = Math.floor(Math.random() * Math.max(1, maxY - minY)) + minY + "px";
    catchGameArea.appendChild(target);
    const life = type === "target-ok-photo" ? 850 : (type === "target-bad-photo" ? 1100 : 950);
    const removeTimer = setTimeout(() => {
      if (target.parentElement) { target.remove(); if (type !== "target-bad-photo") { combo1 = 0; updateCombo1(); } }
    }, life);
    target.addEventListener("pointerdown", e => {
      e.stopPropagation(); e.preventDefault(); clearTimeout(removeTimer);
      const rect = target.getBoundingClientRect(); const areaRect = catchGameArea.getBoundingClientRect();
      hitCatchTarget(type, points, rect.left - areaRect.left + 20, rect.top - areaRect.top);
      target.remove();
    });
  }

  function hitCatchTarget(type, basePoints, x, y) {
    let finalPoints = basePoints;
    if (type === "target-bad-photo") {
      combo1 = 0; feverGauge1 = 0; document.getElementById("feverBar").style.width = "0%";
      playSound("bad"); showFloatText(catchGameArea, "안옼케이! -100 😭", x, y, "#ff2222");
    } else {
      combo1++; playSound(type === "target-ok-photo" ? "ok" : "item");
      if (isFever1) { finalPoints *= 2; }
      else {
        feverGauge1 = Math.min(100, feverGauge1 + (type === "target-ok-photo" ? 25 : 15));
        document.getElementById("feverBar").style.width = feverGauge1 + "%";
        if (feverGauge1 >= 100) triggerFever1();
      }
      if (type === "target-ok-photo") showFloatText(catchGameArea, `모든게 OK! +${finalPoints} 👌`, x, y, "#ffe65a");
      else if (type === "gold") showFloatText(catchGameArea, `황금옥! +${finalPoints} ✨`, x, y, "#ffd84c");
      else showFloatText(catchGameArea, `옥! +${finalPoints} 💎`, x, y, "#80ff9a");
    }
    score1 = Math.max(0, score1 + finalPoints); document.getElementById("score1").innerText = score1; updateCombo1();
  }

  function triggerFever1() {
    isFever1 = true; catchGameArea.classList.add("fever-active");
    showFloatText(catchGameArea, "🔥 FEVER 2X! 🔥", catchGameArea.clientWidth / 2 - 70, 200, "#ffd84c");
    let remain = 5000;
    feverTimer = setInterval(() => {
      remain -= 100; document.getElementById("feverBar").style.width = (remain / 5000) * 100 + "%";
      if (remain <= 0) {
        clearInterval(feverTimer); isFever1 = false; feverGauge1 = 0;
        document.getElementById("feverBar").style.width = "0%"; catchGameArea.classList.remove("fever-active");
      }
    }, 100);
  }

  function updateCombo1() {
    const comboEl = document.getElementById("combo");
    if (combo1 >= 3) { comboEl.innerText = `${combo1} COMBO! 🔥`; comboEl.classList.add("show"); }
    else { comboEl.classList.remove("show"); }
  }

  function showFloatText(parent, text, x, y, color) {
    const el = document.createElement("div"); el.className = "floatText"; el.innerText = text;
    el.style.left = Math.max(10, Math.min(parent.clientWidth - 140, x)) + "px"; el.style.top = y + "px"; el.style.color = color;
    parent.appendChild(el); setTimeout(() => el.remove(), 700);
  }

  function endCatchGame() {
    catchPlaying = false; clearInterval(catchTimer); clearTimeout(catchSpawnTimer); clearInterval(feverTimer);
    document.querySelectorAll(".catch-target").forEach(el => el.remove());
    document.getElementById("finalScore1").innerText = score1; document.getElementById("catchEndScreen").classList.remove("hidden");
  }

  function stopCatchGame() {
    catchPlaying = false; clearInterval(catchTimer); clearTimeout(catchSpawnTimer); clearInterval(feverTimer);
    document.querySelectorAll(".catch-target").forEach(el => el.remove());
  }

  /* 2. Dodge */
  const dodgeCanvas = document.getElementById("dodgeCanvas"); const dodgeCtx = dodgeCanvas.getContext("2d");
  let dodgeAnimId = null, dodgePlaying = false, score2 = 0, lives2 = 3, survivalSeconds2 = 0, dodgeTimeTimer = null;
  let dodgePlayer = { x: 0, y: 0, radius: 34, targetX: 0 }, drops2 = [], particles2 = [], lastSpawnTime2 = 0;

  function startDodgeGame() {
    menuScreen.classList.add("hidden"); catchGameArea.classList.add("hidden"); flappyGameArea.classList.add("hidden");
    dodgeGameArea.classList.remove("hidden"); document.getElementById("dodgeEndScreen").classList.add("hidden");
    const rect = dodgeGameArea.getBoundingClientRect();
    dodgeCanvas.width = rect.width; dodgeCanvas.height = rect.height;
    dodgePlayer.y = dodgeCanvas.height - 70; dodgePlayer.x = dodgeCanvas.width / 2; dodgePlayer.targetX = dodgeCanvas.width / 2;
    score2 = 0; lives2 = 3; survivalSeconds2 = 0; drops2 = []; particles2 = []; dodgePlaying = true;
    document.getElementById("score2").innerText = score2; document.getElementById("time2").innerText = survivalSeconds2;
    document.getElementById("lives2").innerText = "❤️❤️❤️";
    clearInterval(dodgeTimeTimer);
    dodgeTimeTimer = setInterval(() => {
      survivalSeconds2++; document.getElementById("time2").innerText = survivalSeconds2;
      score2 += 5; document.getElementById("score2").innerText = score2;
    }, 1000);
    lastSpawnTime2 = performance.now();
    if (dodgeAnimId) cancelAnimationFrame(dodgeAnimId);
    dodgeLoop(performance.now());
  }

  function handleDodgeMove(clientX) {
    if (!dodgePlaying) return;
    const rect = dodgeCanvas.getBoundingClientRect();
    let x = clientX - rect.left;
    dodgePlayer.targetX = Math.max(dodgePlayer.radius, Math.min(dodgeCanvas.width - dodgePlayer.radius, x));
  }
  window.addEventListener('pointermove', e => { if (dodgePlaying) handleDodgeMove(e.clientX); });
  window.addEventListener('touchmove', e => { if (dodgePlaying && e.touches.length > 0) handleDodgeMove(e.touches[0].clientX); }, { passive: false });

  function spawnDodgeDrop() {
    const r = Math.random();
    let type = 'bad', radius = 32, speed = Math.random() * 2 + 3.2 + (survivalSeconds2 * 0.08);
    if (r < 0.20) { type = 'ok_item'; radius = 26; speed = 3.5; }
    else if (r < 0.35) { type = 'gem'; radius = 20; speed = 4.0; }
    drops2.push({ x: Math.random() * (dodgeCanvas.width - radius * 2) + radius, y: -radius - 10, radius, speed, type, angle: 0, rotSpeed: (Math.random() - 0.5) * 0.08 });
  }

  function dodgeLoop(currentTime) {
    if (!dodgePlaying) return;
    dodgePlayer.x += (dodgePlayer.targetX - dodgePlayer.x) * 0.25;
    const interval = Math.max(220, 600 - (survivalSeconds2 * 12));
    if (currentTime - lastSpawnTime2 > interval) { spawnDodgeDrop(); lastSpawnTime2 = currentTime; }
    dodgeCtx.clearRect(0, 0, dodgeCanvas.width, dodgeCanvas.height);
    for (let i = drops2.length - 1; i >= 0; i--) {
      let d = drops2[i]; d.y += d.speed; d.angle += d.rotSpeed;
      if (d.y - d.radius > dodgeCanvas.height) { drops2.splice(i, 1); continue; }
      dodgeCtx.save(); dodgeCtx.translate(d.x, d.y); dodgeCtx.rotate(d.angle);
      dodgeCtx.beginPath(); dodgeCtx.arc(0, 0, d.radius, 0, Math.PI * 2);
      if (d.type === 'bad') {
        dodgeCtx.fillStyle = '#ff3333'; dodgeCtx.fill(); dodgeCtx.clip();
        if (badImg.complete && badImg.naturalWidth) dodgeCtx.drawImage(badImg, -d.radius, -d.radius, d.radius*2, d.radius*2);
      } else if (d.type === 'ok_item') {
        dodgeCtx.fillStyle = '#ffe65a'; dodgeCtx.fill(); dodgeCtx.clip();
        if (okImg.complete && okImg.naturalWidth) dodgeCtx.drawImage(okImg, -d.radius, -d.radius, d.radius*2, d.radius*2);
      } else {
        dodgeCtx.fillStyle = '#43d46e'; dodgeCtx.fill();
        dodgeCtx.fillStyle = 'white'; dodgeCtx.font = 'bold 16px sans-serif'; dodgeCtx.textAlign = 'center'; dodgeCtx.textBaseline = 'middle'; dodgeCtx.fillText('玉', 0, 1);
      }
      dodgeCtx.restore();
      if (Math.hypot(dodgePlayer.x - d.x, dodgePlayer.y - d.y) < dodgePlayer.radius + d.radius - 6) {
        if (d.type === 'bad') {
          lives2--; document.getElementById("lives2").innerText = "❤️❤️❤️".slice(0, Math.max(0, lives2));
          playSound('hit');
          if (lives2 <= 0) { endDodgeGame(); return; }
        } else {
          score2 += (d.type === 'ok_item' ? 50 : 20); document.getElementById("score2").innerText = score2; playSound('item');
        }
        drops2.splice(i, 1);
      }
    }
    dodgeCtx.save(); dodgeCtx.translate(dodgePlayer.x, dodgePlayer.y);
    dodgeCtx.beginPath(); dodgeCtx.arc(0, 0, dodgePlayer.radius, 0, Math.PI * 2);
    dodgeCtx.fillStyle = '#43d46e'; dodgeCtx.fill(); dodgeCtx.clip();
    if (okImg.complete && okImg.naturalWidth) dodgeCtx.drawImage(okImg, -dodgePlayer.radius, -dodgePlayer.radius, dodgePlayer.radius*2, dodgePlayer.radius*2);
    dodgeCtx.restore();
    dodgeAnimId = requestAnimationFrame(dodgeLoop);
  }

  function endDodgeGame() {
    dodgePlaying = false; clearInterval(dodgeTimeTimer);
    if (dodgeAnimId) cancelAnimationFrame(dodgeAnimId);
    document.getElementById("finalTime2").innerText = survivalSeconds2; document.getElementById("finalScore2").innerText = score2;
    document.getElementById("dodgeEndScreen").classList.remove("hidden");
  }

  function stopDodgeGame() {
    dodgePlaying = false; clearInterval(dodgeTimeTimer);
    if (dodgeAnimId) cancelAnimationFrame(dodgeAnimId);
  }

  /* 3. Flappy */
  const flappyCanvas = document.getElementById("flappyCanvas"); const flappyCtx = flappyCanvas.getContext("2d");
  let flappyAnimId = null, flappyPlaying = false, score3 = 0, bestScore3 = 0;
  let bird = { x: 80, y: 250, radius: 24, vy: 0, gravity: 0.38, jump: -6.8 }, pipes = [], lastPipeSpawn = 0;

  function startFlappyGame() {
    menuScreen.classList.add("hidden"); catchGameArea.classList.add("hidden"); dodgeGameArea.classList.add("hidden");
    flappyGameArea.classList.remove("hidden"); document.getElementById("flappyEndScreen").classList.add("hidden");
    const rect = flappyGameArea.getBoundingClientRect();
    flappyCanvas.width = rect.width; flappyCanvas.height = rect.height;
    score3 = 0; bird.y = flappyCanvas.height / 2; bird.vy = 0; pipes = []; flappyPlaying = true;
    document.getElementById("score3").innerText = score3; document.getElementById("best3").innerText = bestScore3;
    lastPipeSpawn = performance.now();
    if (flappyAnimId) cancelAnimationFrame(flappyAnimId);
    flappyLoop(performance.now());
  }

  function handleFlappyTap(e) {
    if (!flappyPlaying) return;
    if (e) { e.preventDefault(); e.stopPropagation(); }
    bird.vy = bird.jump; playSound('jump');
  }
  flappyGameArea.addEventListener("pointerdown", handleFlappyTap);

  function spawnPipe() {
    const gap = 160, minH = 70;
    const maxH = flappyCanvas.height - gap - minH - 40;
    const topHeight = Math.floor(Math.random() * (maxH - minH)) + minH;
    pipes.push({ x: flappyCanvas.width + 20, width: 64, topHeight: topHeight, bottomY: topHeight + gap, passed: false });
  }

  function flappyLoop(currentTime) {
    if (!flappyPlaying) return;
    bird.vy += bird.gravity; bird.y += bird.vy;
    if (currentTime - lastPipeSpawn > 1600) { spawnPipe(); lastPipeSpawn = currentTime; }
    flappyCtx.clearRect(0, 0, flappyCanvas.width, flappyCanvas.height);

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i]; p.x -= 2.6;
      if (p.x + p.width < 0) { pipes.splice(i, 1); continue; }
      flappyCtx.fillStyle = '#220808'; flappyCtx.strokeStyle = '#ff3333'; flappyCtx.lineWidth = 3;
      flappyCtx.fillRect(p.x, 0, p.width, p.topHeight); flappyCtx.strokeRect(p.x, 0, p.width, p.topHeight);
      if (badImg.complete && badImg.naturalWidth) flappyCtx.drawImage(badImg, p.x + (p.width - 50)/2, p.topHeight - 56, 50, 50);

      const bottomHeight = flappyCanvas.height - p.bottomY;
      flappyCtx.fillRect(p.x, p.bottomY, p.width, bottomHeight); flappyCtx.strokeRect(p.x, p.bottomY, p.width, bottomHeight);
      if (badImg.complete && badImg.naturalWidth) flappyCtx.drawImage(badImg, p.x + (p.width - 50)/2, p.bottomY + 6, 50, 50);

      if (!p.passed && p.x + p.width < bird.x - bird.radius) {
        p.passed = true; score3++; document.getElementById("score3").innerText = score3; playSound('pass');
      }
      const inX = (bird.x + bird.radius - 4 > p.x) && (bird.x - bird.radius + 4 < p.x + p.width);
      const inTopY = bird.y - bird.radius + 4 < p.topHeight;
      const inBottomY = bird.y + bird.radius - 4 > p.bottomY;
      if (inX && (inTopY || inBottomY)) { endFlappyGame(); return; }
    }

    if (bird.y + bird.radius > flappyCanvas.height || bird.y - bird.radius < 0) { endFlappyGame(); return; }

    flappyCtx.save(); flappyCtx.translate(bird.x, bird.y);
    const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));
    flappyCtx.rotate(angle);
    flappyCtx.beginPath(); flappyCtx.arc(0, 0, bird.radius, 0, Math.PI * 2);
    flappyCtx.fillStyle = '#ffd84c'; flappyCtx.shadowColor = '#ffe65a'; flappyCtx.shadowBlur = 12; flappyCtx.fill(); flappyCtx.clip();
    if (okImg.complete && okImg.naturalWidth) flappyCtx.drawImage(okImg, -bird.radius, -bird.radius, bird.radius * 2, bird.radius * 2);
    flappyCtx.restore();

    flappyAnimId = requestAnimationFrame(flappyLoop);
  }

  function endFlappyGame() {
    flappyPlaying = false;
    if (flappyAnimId) cancelAnimationFrame(flappyAnimId);
    playSound('hit');
    if (score3 > bestScore3) bestScore3 = score3;
    document.getElementById("finalScore3").innerText = score3; document.getElementById("flappyEndScreen").classList.remove("hidden");
  }

  function stopFlappyGame() {
    flappyPlaying = false;
    if (flappyAnimId) cancelAnimationFrame(flappyAnimId);
  }
</script>
